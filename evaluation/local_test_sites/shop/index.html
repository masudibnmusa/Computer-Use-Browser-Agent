<!doctype html>
<html><head><meta charset="utf-8"><title>Test Shop</title></head>
<body>
  <h1>Test Shop</h1>
  <label for="q">Search products</label>
  <input id="q" type="text" placeholder="Search...">
  <button id="go">Search</button>
  <ul id="results"></ul>
  <script>
    const products = [
      {name: "Trail Backpack", price: "49.99"},
      {name: "Camp Stove", price: "29.50"},
      {name: "Water Filter", price: "34.00"},
    ];
    function render(list) {
      document.getElementById("results").innerHTML = list.map(p =>
        `<li>${p.name} - $${p.price} <a href="checkout.html?item=${encodeURIComponent(p.name)}">Buy</a></li>`
      ).join("");
    }
    render(products);
    document.getElementById("go").onclick = () => {
      const q = document.getElementById("q").value.toLowerCase();
      render(products.filter(p => p.name.toLowerCase().includes(q)));
    };
  </script>
</body></html>
